before_install:
  - wget https://sh.rustup.rs -O rustup.sh \
    && sh rustup.sh -y \
    && rm rustup.sh \
    && rm .profile \
    && ${HOME}/.cargo/bin/rustup target add \
        aarch64-linux-android \
        armv7-linux-androideabi \
        i686-linux-android \
        x86_64-linux-android \
    && ${HOME}/.cargo/bin/rustup toolchain install nightly \
    && ${HOME}/.cargo/bin/rustup target add --toolchain nightly \
        aarch64-linux-android \
        armv7-linux-androideabi \
        i686-linux-android \
        x86_64-linux-android
  - sdk install java 8.0.392-zulu
  - sdk install java 17-open
  - sdk use java 8.0.392-zulu  # Use Java 8 for SDK tools
  - yes | sdkmanager --licenses || true
  - sdkmanager --uninstall "ndk-bundle" || true
  - sdkmanager "ndk;28.2.13676358"
  - sdk use java 17-open  # Switch back to Java 17 for building
  
jdk:
  - openjdk17
